# These scripts use the configurable step; native helper arrows keep step: 100.
script battery:
  battery_power_limit_adjust:
    alias: "Battery power limit: adjust"
    mode: queued
    max: 20
    fields:
      direction:
        name: Direction
        required: true
        selector:
          select:
            options:
            - increase
            - decrease
    sequence:
    - condition: template
      value_template: |-
        {{ direction in ['increase', 'decrease']
           and is_number(states('input_number.battery_power_limit'))
           and is_number(states('input_number.battery_power_limit_step')) }}
    - variables:
        limit_w: "{{ states('input_number.battery_power_limit') | float }}"
        step_w: "{{ states('input_number.battery_power_limit_step') | float }}"
        min_w: "{{ state_attr('input_number.battery_power_limit', 'min') | float(100) }}"
        max_w: "{{ state_attr('input_number.battery_power_limit', 'max') | float(3000) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.battery_power_limit
      data:
        value: |-
          {% set delta = step_w if direction == 'increase' else -step_w %}
          {{ [[limit_w + delta, max_w] | min, min_w] | max }}
  battery_power_limit_increase:
    alias: "Battery power limit: increase"
    mode: parallel
    sequence:
    - action: script.battery_power_limit_adjust
      data:
        direction: increase
  battery_power_limit_decrease:
    alias: "Battery power limit: decrease"
    mode: parallel
    sequence:
    - action: script.battery_power_limit_adjust
      data:
        direction: decrease
