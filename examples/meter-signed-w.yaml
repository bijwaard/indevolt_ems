# Merge into configuration.yaml; replace the placeholder entity.
# Meter convention: positive = import; negative = export. Input is watts.
# Alternative to the root power_surplus template, not an additional sensor.
template:
  - sensor:
      - name: Power Surplus
        unique_id: power_surplus
        default_entity_id: sensor.power_surplus
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        availability: >-
          {{ is_number(states('sensor.your_signed_grid_power_w')) }}
        state: >-
          {{ -(states('sensor.your_signed_grid_power_w') | float(0)) / 1000 }}
