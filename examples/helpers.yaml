# Merge these mappings into configuration.yaml; do not duplicate helpers.
input_number:
  battery_damping_percent:
    name: "Battery control damping"
    min: 1
    max: 100
    step: 1
    initial: 30
    unit_of_measurement: "%"
    mode: box
  battery_min_power_difference:
    name: "Battery minimum target difference"
    min: 0
    max: 1000
    step: 10
    initial: 100
    unit_of_measurement: "W"
    mode: box
  battery_power_limit_step:
    name: "Battery power limit adjustment step"
    min: 1
    max: 1000
    step: 1
    initial: 100
    unit_of_measurement: "W"
    mode: box
  battery_power_limit:
    name: "Battery charge/discharge power limit"
    min: 100
    max: 3000
    step: 100
    initial: 2400
    unit_of_measurement: "W"
    mode: box
  real_time_battery_power:
    name: "Real time battery power"
    min: -3.0
    max: 3.0
    step: 0.001
    unit_of_measurement: "kW"

input_boolean:
  force_cheap_energy:
    name: "Force Cheap Energy"
    icon: mdi:flash
  boiler_block_battery:
    name: "Boiler block battery charging"
    initial: false
