sensor:
  - name: "Solar Panel Delivery"
    state_topic: "domoticz/out"
    value_template: >
      {% if value_json.name == 'Solar uitbouw' and value_json.svalue2 is not none and value_json.svalue2 != 'unknown' %}
        {{ value_json.svalue2 | float * 0.001 }}
      {% else %}
        {{ states('sensor.solar_panel_delivery') | float('nan') }}
      {% endif %}
    unit_of_measurement: "kWh"
    # device_class: energy
    state_class: total_increasing
    unique_id: "solar_panel_delivery"

  - name: "Solar Panel Delivery2"
    state_topic: "domoticz/in"
    value_template: >
      {% if value_json.name == 'inverter:power_median' and value_json.svalue is not none and value_json.svalue != 'unknown' %}
        {{ value_json.svalue.split(';')[-1] | float*-1.0 | round(2) }}
      {% else %}
        {{ states('sensor.solar_panel_delivery2') | float('nan') }}
      {% endif %}
    unit_of_measurement: "W"
    # device_class: energy
    state_class: total
    unique_id: "solar_panel_delivery2"

  - name: "Solar Panel TriPhase"
    state_topic: "domoticz/in"
    value_template: >
     {% if value_json.name == 'CT2:power_median' and value_json.svalue is not none %}
        {% set phases = value_json.svalue.split(';') %}
        {{ (phases[0]|float + phases[1]|float + phases[2]|float) * -1.0 | round(2) }}
      {% else %}
        {{ states('sensor.solar_panel_triphase') | float('nan') }}
      {% endif %}
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    unique_id: "solar_panel_triphase"

  - name: "Solar Panel Single Phase"
    state_topic: "domoticz/in"
    value_template: >
      {% if value_json.name == 'inverter:energy' and value_json.svalue is not none and value_json.svalue != 'unknown' %}
        {{ value_json.svalue | float * -1.0 }}
      {% else %}
        {{ states('sensor.solar_panel_singlephase') | float('nan') }}
      {% endif %}
    unit_of_measurement: "Wh"
    device_class: energy
    state_class: total
    unique_id: "solar_panel_singlephase"

